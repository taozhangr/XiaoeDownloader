[project]
name = "xiaoe-downloader"
version = "1.0.0"
description = "小鹅通下载器：登录小鹅通后选择并下载当前账号可访问的课程内容"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<1",
    "imageio-ffmpeg>=0.6.0,<1",
    "platformdirs>=4.3.8,<5",
    "playwright>=1.54.0,<2",
    "pycryptodome>=3.23.0,<4",
    "rich>=14.1.0,<15",
]

[project.scripts]
xiaoe-downloader = "xiaoe_downloader.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaoe_downloader"]

[dependency-groups]
dev = [
    "ruff>=0.12.7,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["（", "）", "，", "："]
